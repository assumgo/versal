# Trecho nginx para Alocação de Recursos em /alocacao/
# Os estáticos ficam em /var/www/alocacao (cópia/symlink do frontend/dist).

location = /alocacao {
    return 301 /alocacao/;
}

location /alocacao/api/ {
    proxy_pass http://127.0.0.1:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32m;
}

location = /alocacao/health {
    proxy_pass http://127.0.0.1:8001/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location /alocacao/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ /alocacao/index.html;
}

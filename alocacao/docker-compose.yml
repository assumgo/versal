services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    ports:
      - '8001:8001'
    environment:
      CORS_ORIGINS: http://localhost:5174

  frontend:
    image: node:24-bookworm
    working_dir: /app
    volumes:
      - ./frontend:/app
      - alocacao_node_modules:/app/node_modules
    command: >
      sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - '5174:5174'
    environment:
      VITE_ALLOW_DEV_LOGIN: 'true'
      VITE_API_URL: http://localhost:8001
    depends_on:
      - api

volumes:
  alocacao_node_modules:

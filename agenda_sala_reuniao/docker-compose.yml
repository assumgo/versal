services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenda_sala}
      POSTGRES_USER: ${POSTGRES_USER:-agenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em agenda_sala_reuniao/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: ./backend
    environment: &backend_environment
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agenda}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agenda_sala}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY em agenda_sala_reuniao/.env}
      FRONTEND_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-5174}}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: ./backend
    environment: *backend_environment
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8010}/api/v1}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-5174}:5174"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5174/').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:

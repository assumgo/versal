services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestao
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em gestao-projetos/.env}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao -d gestao"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gestao:${POSTGRES_PASSWORD}@db:5432/gestao
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gestao:${POSTGRES_PASSWORD}@db:5432/gestao
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      - backend
